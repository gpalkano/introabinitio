<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" 
          content="width=device-width,initial-scale=1.0">
    <title>Responsive Form Card</title>
    <link rel="stylesheet" href=
"https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="index.css">
</head>

<body>
	
    <h1>Intro to ab initio nuclear theory</h1>
    <h3>Let me know what you thought of the course!
    </h3>
    <div class="form-box">
        <div class="textup">
            <i class="fa fa-solid fa-clock"></i>
            It only takes two minutes!!
        </div>
        <form>
            <label for="uname">
                <i class="fa fa-solid fa-user"></i>
                Name
            </label>
            <input type="text" id="uname" 
                   name="uname" required>

            <label for="email">
                <i class="fa fa-solid fa-envelope"></i>
                Email Address
            </label>
            <input type="email" id="email" 
                   name="email" required>

            <label for="phone">
                <i class="fa-solid fa-phone"></i>
                Phone No
            </label>
            <input type="tel" id="phone" 
                   name="phone" required>

            <label>
                <i class="fa-solid fa-face-smile"></i>
                Do you satisfy with our service?
            </label>
            <div class="radio-group">
                <input type="radio" id="yes" 
                       name="satisfy" value="yes" checked>
                <label for="yes">Yes</label>

                <input type="radio" id="no" 
                       name="satisfy" value="no">
                <label for="no">No</label>
            </div>

            <label for="msg">
                <i class="fa-solid fa-comments" 
                   style="margin-right: 3px;"></i>
                Write your Suggestions:
            </label>
            <textarea id="msg" name="msg" 
                      rows="4" cols="10" required>
            </textarea>
            <button type="submit">
                Submit
            </button>
        </form>
		
	  <h2> &ensp;Lectures</h2>
	  <table class="w3-table">
	<tr>
       <td>  <i>Introduction</i></td> 
		<td><a href="https://github.com/gpalkano/introabinitio/blob/main/qmc_lecture.pdf"> <b>Lecture Notes</b></a></td> 
    </tr>
	<tr>
      <td> <i>A novel way of recasting the Bardeen-Cooper-Schrieffer gap equations</i> <br>
	      G. Palkanoglou and A. Gezerlis</td> 
		<td><a href="https://arxiv.org/abs/2510.07384">Preprint</a> </td> 
    </tr>
   </table>
	<br>
  <!--/div-->	
<!--hr style="height:2px;border-width:0;color:black;background-color:grey"-->
</div>
    </body>

</html>
